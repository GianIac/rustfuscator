[package]
name = "rust_code_obfuscator_core"
version = "0.3.2"
edition = "2021"
build = "src/build.rs"
description = "Core encryption and obfuscation logic for rustfuscator"
license = "MIT"
repository = "https://github.com/GianIac/rustfuscator"

[features]
default = []
secure_zeroize = []
verify_literals = []

[build-dependencies]
rand = "0.10.2"

[dependencies]
cryptify = "3.2.1"
rand = "0.10.2"
aes-gcm = "0.11.0"
zeroize = "1.9.0"
