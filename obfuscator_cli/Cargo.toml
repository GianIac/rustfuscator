[package]
name = "obfuscator_cli"
version = "0.3.2"
edition = "2021"
description = "Command-line source transformer for rust_code_obfuscator"
license = "MIT"
repository = "https://github.com/GianIac/rustfuscator"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
walkdir = "2.5.0"
anyhow = "1.0.104"

syn = { version = "3.0.3", features = ["full", "visit-mut"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
fs_extra = "1.3.0"
toml_edit = "0.25.13"
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }
globset = "0.4.20"
serde_json = "1.0.151"
cargo_metadata = "0.23.1"
similar = "3.2.0"
prettyplease = "0.3.0"
tempfile = "3.27.0"

rust_code_obfuscator_core = { version = "0.3.2", path = "../rust_code_obfuscator_core" }
