[package]
name = "rust_code_obfuscator"
version = "0.3.2"
edition = "2021"
license = "MIT"
description = "A Rust library to easily obfuscate strings and control-flow using cryptify lib"
repository = "https://github.com/GianIac/rustfuscator"
keywords = ["obfuscation", "macros", "cli", "security", "rust-tools"]
categories = ["development-tools", "command-line-utilities", "cryptography"]

[lib]
name = "rust_code_obfuscator"
path = "src/lib.rs"

[workspace]
members = [
    "obfuscator_cli",
    "obfuscator_derive",
    "rust_code_obfuscator_core"
]

[features]
default = []
secure_zeroize = [
    "rust_code_obfuscator_core/secure_zeroize",
    "obfuscator_derive/secure_zeroize"
]
verify_literals = ["rust_code_obfuscator_core/verify_literals"]

[dependencies]
rust_code_obfuscator_core = { version = "0.3.2", path = "rust_code_obfuscator_core" }
obfuscator_derive = { version = "0.3.2", path = "obfuscator_derive" }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "macro_overhead"
harness = false
